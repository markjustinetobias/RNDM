<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <div class="calculator">

            <div class="brand">
                <span>BASIC CALC</span>
                <span class="model">MJ - 01</span>
            </div>

            <div class="screen-wrap">
                <div class="screen-label">©Tobias</div>

                <div class="screen" id="display">0</div>
            </div>

            <form id="calculator-form">
                <div class="keys">

                    <button type="submit" name="action" value="clear" class="key key-function">
                        AC
                    </button>

                    <button type="submit" name="action" value="op_%" class="key key-function">
                        MOD
                    </button>

                    <button type="submit" name="action" value="op_/" class="key key-operator">
                        ÷
                    </button>

                    <button type="submit" name="action" value="op_*" class="key key-operator">
                        ×
                    </button>

                    <button type="submit" name="action" value="digit_7" class="key">7</button>

                    <button type="submit" name="action" value="digit_8" class="key">8</button>

                    <button type="submit" name="action" value="digit_9" class="key">9</button>

                    <button type="submit" name="action" value="op_-" class="key key-operator">
                        −
                    </button>

                    <button type="submit" name="action" value="digit_4" class="key">4</button>

                    <button type="submit" name="action" value="digit_5" class="key">5</button>

                    <button type="submit" name="action" value="digit_6" class="key">6</button>

                    <button type="submit" name="action" value="op_+" class="key key-operator">
                        +
                    </button>

                    <button type="submit" name="action" value="digit_1" class="key">1</button>

                    <button type="submit" name="action" value="digit_2" class="key">2</button>

                    <button type="submit" name="action" value="digit_3" class="key">3</button>

                    <button type="submit" name="action" value="equals" class="key key-equals">
                        =
                    </button>

                    <button type="submit" name="action" value="digit_0" class="key key-wide">
                        0
                    </button>

                    <button type="submit" name="action" value="decimal" class="key">.</button>

                    <button type="submit" name="action" value="delete" class="key key-function">
                        DEL
                    </button>

                </div>
            </form>

            <footer class="calculator-footer">
                ©Tobias
            </footer>
        </div>

        <p class="page-note">walang katapusang calcuator!</p>
    </main>

    <div class="ad-overlay" id="fakeAd">
        <div class="ad-window">
            <div class="ad-titlebar">
                <span>★ SPECIAL OFFER ★</span>
                <button id="closeAd" class="ad-close" aria-label="Close advertisement">X</button>
            </div>


            <div class="ad-content">
                <p class="ad-flash" id="adHeadline">!!! MAMA !!!</p>

                <img id="adImage" src="rene.jpg" alt="Retro advertisement" class="ad-image">

                <h2 id="adTitle">Mahal mo ba si RENE?</h2>
                <p class="ad-tagline" id="adTagline">
                    sumama ka na!
                </p>

                <div class="ad-price">
                    <span id="adOldPrice">WAS $19.99</span>
                    <strong id="adPrice">NOW $4.99!</strong>
                </div>

                <p class="ad-small" id="adDescription">
                    A totally fictional product.
                </p>

                <button class="ad-buy" id="adBuy">BUY NOW!!!</button>
            </div>


            <script src="script.js"></script>


</body>

</html>


</html>
